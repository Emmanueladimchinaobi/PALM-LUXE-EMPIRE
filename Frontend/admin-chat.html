<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<title>Admin Chat</title>

</head>

<body class="bg-gray-100">

<div class="max-w-5xl mx-auto p-6">

<h1 class="text-3xl font-bold mb-6">

Palm Luxe Empire Admin Chat

</h1>

<div
id="messages"
class="bg-white rounded-lg shadow h-[500px] overflow-y-auto p-4 space-y-3"
>

</div>

<div class="flex mt-4">

<input
id="admin-input"
type="text"
placeholder="Reply..."
class="flex-1 border rounded-l-lg p-3 outline-none"
/>

<button
id="admin-send"
class="bg-pink-600 text-white px-6 rounded-r-lg"
>

Send

</button>

</div>

</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script src="./admin-chat.js"></script>

</body>
</html>
